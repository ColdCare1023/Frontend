name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Pruebas
        run: npm run test:run

      # Se construyen las DOS variantes: Vercel despliega `build:demo`, pero el
      # build real es el que se usaría contra el backend. Si solo se comprobara
      # uno, el otro podría llevar tiempo roto sin que nadie lo notara.
      - name: Build (producción)
        run: npm run build

      # FE-009: el build contra el backend no lleva el modo demo (adaptador,
      # cuentas, contraseña ni JWT sin firma).
      - name: Bundle de producción sin modo demo
        run: npm run verificar:bundle

      - name: Build (demo)
        run: npm run build:demo

      # FE-002: un build sin modo de datos explícito debe fallar, nunca caer
      # en demo por omisión.
      - name: Build sin modo explícito falla
        run: |
          if npx vite build --outDir /tmp/build-sin-modo; then
            echo "El build sin VITE_MODO_DEMO no falló" && exit 1
          fi

      # HU-55 / A-1: Vercel debe servir el build contra el backend real. Mientras
      # vercel.json siga en modo demo, las HU que dependen del despliegue no
      # cumplen la Definición de Hecho: se avisa en cada ejecución.
      - name: vercel.json en modo producción
        run: |
          if grep -q '"buildCommand": "npm run build:demo"' vercel.json; then
            echo "::warning file=vercel.json::Vercel sigue sirviendo build:demo. Ejecute: node scripts/generar-vercel-json.mjs https://<backend>.up.railway.app"
          fi
